name: .NET Core

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3
    - name: Setup .NET Core
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.x
    - name: Install dependencies
      run: dotnet restore ./AwesomeChatBot.Tests/AwesomeChatBot.Tests.csproj
    - name: Build
      run: dotnet build ./AwesomeChatBot/AwesomeChatBot.csproj --configuration Release --no-restore
    - name: Test
      run: dotnet test ./AwesomeChatBot.Tests/AwesomeChatBot.Tests.csproj --no-restore --verbosity normal
